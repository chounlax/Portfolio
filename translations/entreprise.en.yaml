hero:
    kicker: "AVAILABLE FOR NEW PROJECTS"
    title: "FREELANCE DEVELOPER"
    tagline: "I build websites and web & mobile apps for craftspeople, shops, non-profits and small businesses. One single contact, from your needs all the way to going live."
    status_label: "STATUS"
    status: "Self-employed (France)"
    zone_label: "AREA"
    zone: "Arras, France · remote"
    pricing_label: "PRICING"
    pricing: "Custom quote"
    contact_label: "CONTACT"
    cta: "Request a quote"
    corner: "idea + talk + code = project online;"
    terminal_quote: "custom quote, reply by e-mail"

services:
    kicker: "// 01 — WHAT I OFFER"
    title: "My services"
    for_label: "GREAT FOR"
    items:
        -   icon: "globe"
            title: "Showcase website"
            text: "A clear, fast website to present your business, opening hours and work, easy to read on phones and computers, with a contact form."
            for: "Craftspeople, shops, non-profits"
            tags: ["Responsive", "Contact form", "Hosting setup"]
        -   icon: "database"
            title: "Custom web application"
            text: "A tool that fits the way you work: managing customers, bookings or stock, with a database and a secure admin area."
            for: "Businesses, non-profits, internal teams"
            tags: ["Symfony", "PHP", "MySQL"]
        -   icon: "mobile"
            title: "Mobile app"
            text: "An Android and iOS app for your customers or your field teams, connected to your data through an API."
            for: "Field teams, customer services"
            tags: ["Flutter", "Dart", "REST API"]
        -   icon: "tool"
            title: "Maintenance & updates"
            text: "Bug fixes, small improvements and content updates for an existing website, so it stays reliable and up to date."
            for: "Websites and apps already online"
            tags: ["Bug fixes", "Improvements", "Content"]

method:
    kicker: "// 02 — PROCESS"
    title: "How it works"
    steps:
        -   icon: "users"
            title: "Discussion"
            text: "We talk about your business, your needs and your constraints, so I fully understand what you expect."
        -   icon: "file"
            title: "Quote"
            text: "I send you a detailed proposal: what will be built, the price and the timeline, agreed before any work starts."
        -   icon: "code"
            title: "Development"
            text: "I build your project and regularly show you the progress, so we can adjust it along the way."
        -   icon: "send"
            title: "Launch"
            text: "I put your website or app online and show you how to use it day to day."

reference:
    kicker: "// 03 — PAST WORK"
    title: "Project example"
    category: "WEB · MOBILE"
    text: "A business application built as a team for the non-profit Habitat Insertion to manage its vehicle fleet. It combines a Symfony back office, a JWT-secured API and a Flutter mobile app for staff in the field."
    cta: "See the project (in French)"

contact:
    kicker: "// 04 — CONTACT"
    title: "Got a project in mind? Let's talk."
    quote: "Request a quote"
    portfolio: "See my portfolio"

