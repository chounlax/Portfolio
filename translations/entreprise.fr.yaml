# Textes de la page /entreprise en français.
# Le fichier entreprise.en.yaml contient exactement les mêmes clés, en anglais.
meta:
    title: "Services web & mobile — Sean Thompson"
    description: "Sean Thompson, développeur web et mobile auto-entrepreneur : sites vitrines, applications web sur mesure, applications mobiles et maintenance."

nav:
    services: "Services"
    method: "Déroulement"
    reference: "Réalisation"
    contact: "Contact"
    back: "Portfolio"

hero:
    kicker: "DISPONIBLE POUR DE NOUVEAUX PROJETS"
    title: "DÉVELOPPEUR INDÉPENDANT"
    tagline: "Je crée des sites et des applications web et mobiles pour les artisans, commerces, associations et petites entreprises. Un seul interlocuteur, de votre besoin jusqu'à la mise en ligne."
    status_label: "STATUT"
    status: "Auto-entrepreneur"
    zone_label: "ZONE"
    zone: "Arras & Pas-de-Calais · à distance"
    pricing_label: "TARIFS"
    pricing: "Sur devis"
    contact_label: "CONTACT"
    cta: "Demander un devis"
    corner: "idée + échange + code = projet en ligne;"
    terminal_quote: "sur devis, réponse par e-mail"

services:
    kicker: "// 01 — CE QUE JE PROPOSE"
    title: "Mes services"
    for_label: "IDÉAL POUR"
    items:
        -   icon: "globe"
            title: "Site vitrine"
            text: "Un site clair et rapide pour présenter votre activité, vos horaires et vos réalisations, lisible sur téléphone comme sur ordinateur, avec un formulaire de contact."
            for: "Artisans, commerces, associations"
            tags: ["Responsive", "Formulaire de contact", "Mise en ligne"]
        -   icon: "database"
            title: "Application web sur mesure"
            text: "Un outil adapté à votre façon de travailler : gestion de clients, de réservations ou de stocks, avec une base de données et un espace d'administration sécurisé."
            for: "Entreprises, associations, structures internes"
            tags: ["Symfony", "PHP", "MySQL"]
        -   icon: "mobile"
            title: "Application mobile"
            text: "Une application Android et iOS pour vos clients ou vos équipes sur le terrain, reliée à vos données grâce à une API."
            for: "Équipes terrain, services aux clients"
            tags: ["Flutter", "Dart", "API REST"]
        -   icon: "tool"
            title: "Maintenance & mises à jour"
            text: "Corrections, petites évolutions et mise à jour des contenus d'un site existant, pour qu'il reste fiable et à jour."
            for: "Sites et applications déjà en ligne"
            tags: ["Corrections", "Évolutions", "Contenus"]

method:
    kicker: "// 02 — DÉROULEMENT"
    title: "Comment ça se passe"
    steps:
        -   icon: "users"
            title: "Échange"
            text: "On discute de votre activité, de votre besoin et de vos contraintes, pour bien comprendre ce que vous attendez."
        -   icon: "file"
            title: "Devis"
            text: "Je vous envoie une proposition détaillée : ce qui sera réalisé, le prix et le délai, validés avant de commencer."
        -   icon: "code"
            title: "Réalisation"
            text: "Je développe votre projet et vous montre régulièrement son avancement pour l'ajuster au fur et à mesure."
        -   icon: "send"
            title: "Mise en ligne"
            text: "Je mets votre site ou votre application en ligne et vous explique comment l'utiliser au quotidien."

reference:
    kicker: "// 03 — UNE RÉALISATION"
    title: "Exemple de projet"
    category: "WEB · MOBILE"
    text: "Application métier réalisée en équipe pour l'association Habitat Insertion afin de gérer sa flotte de véhicules. Elle réunit un back-office Symfony, une API sécurisée par JWT et une application mobile Flutter pour les salariés sur le terrain."
    cta: "Voir le projet"

contact:
    kicker: "// 04 — CONTACT"
    title: "Un projet en tête ? Parlons-en."
    quote: "Demander un devis"
    portfolio: "Voir mon portfolio"

# E-mail préparé par le bouton « Demander un devis »
quote:
    subject: "Demande de devis"
    body: "Bonjour Sean,\n\nJe souhaiterais un devis pour :\n- Type de projet : \n- Description : \n- Délai souhaité : \n\nMerci,\n"

